services:
  fia-portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FIA_PORTFOLIO_PORT}:8765"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
