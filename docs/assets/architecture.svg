<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Financial Insight Agent architecture</title>
  <desc id="desc">기업 질문을 식별하고 근거를 검증한 뒤 세 capability와 통합 관찰을 제공하는 전체 구조와 공개 실행 경계</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#12223b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title { font: 700 38px 'Segoe UI','Malgun Gothic',sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 18px 'Segoe UI','Malgun Gothic',sans-serif; fill: #a8bdd8; }
      .lane { font: 700 20px 'Segoe UI','Malgun Gothic',sans-serif; fill: #e2e8f0; }
      .box-title { font: 700 19px 'Segoe UI','Malgun Gothic',sans-serif; fill: #f8fafc; }
      .body { font: 400 15px 'Segoe UI','Malgun Gothic',sans-serif; fill: #cbd5e1; }
      .small { font: 400 13px 'Segoe UI','Malgun Gothic',sans-serif; fill: #a8bdd8; }
      .tag { font: 700 12px 'Segoe UI','Malgun Gothic',sans-serif; fill: #07111f; }
      .arrow { stroke: #7dd3fc; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 8; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" class="title">Financial Insight Agent</text>
  <text x="70" y="105" class="subtitle">Evidence-grounded analysis · full architecture and public-safe execution boundary</text>

  <text x="70" y="158" class="lane">1 · QUESTION &amp; ORCHESTRATION</text>
  <text x="465" y="158" class="lane">2 · BOUNDED ACQUISITION</text>
  <text x="865" y="158" class="lane">3 · CANONICAL EVIDENCE</text>
  <text x="1260" y="158" class="lane">4 · PRODUCT RESULT</text>

  <g filter="url(#shadow)">
    <rect x="60" y="185" width="320" height="155" rx="18" fill="#142a46" stroke="#38bdf8" stroke-width="2"/>
    <rect x="82" y="207" width="94" height="24" rx="12" fill="#38bdf8"/>
    <text x="98" y="224" class="tag">USER INPUT</text>
    <text x="82" y="263" class="box-title">기업 식별 · clarification</text>
    <text x="82" y="291" class="body">회사명 / ticker / alias</text>
    <text x="82" y="316" class="body">owner-bound encrypted resume</text>

    <rect x="60" y="375" width="320" height="185" rx="18" fill="#142a46" stroke="#38bdf8" stroke-width="2"/>
    <text x="82" y="413" class="box-title">Freshness &amp; durable runtime</text>
    <text x="82" y="446" class="body">fresh · stale · missing · corrupt</text>
    <text x="82" y="474" class="body">job · lease · heartbeat · retry budget</text>
    <text x="82" y="502" class="body">idempotency · request ledger</text>
    <text x="82" y="530" class="small">cache hit이면 외부 호출 0</text>

    <rect x="455" y="185" width="330" height="110" rx="18" fill="#1b3150" stroke="#a78bfa" stroke-width="2"/>
    <text x="477" y="225" class="box-title">Report adapter</text>
    <text x="477" y="255" class="body">bounded search → PDF quarantine</text>
    <text x="477" y="278" class="small">host · MIME · signature · resource guard</text>

    <rect x="455" y="320" width="330" height="110" rx="18" fill="#1b3150" stroke="#a78bfa" stroke-width="2"/>
    <text x="477" y="360" class="box-title">Financial adapter</text>
    <text x="477" y="390" class="body">filing · period · unit · receipt lineage</text>
    <text x="477" y="413" class="small">company identity fail-closed binding</text>

    <rect x="455" y="455" width="330" height="110" rx="18" fill="#1b3150" stroke="#a78bfa" stroke-width="2"/>
    <text x="477" y="495" class="box-title">Market adapter</text>
    <text x="477" y="525" class="body">OHLCV · session · ticker lineage</text>
    <text x="477" y="548" class="small">entitlement · bounded request contract</text>

    <rect x="855" y="185" width="330" height="130" rx="18" fill="#153646" stroke="#34d399" stroke-width="2"/>
    <text x="877" y="225" class="box-title">Private processing boundary</text>
    <text x="877" y="255" class="body">validated PDF → parser</text>
    <text x="877" y="283" class="body">chunk → embedding → promotion</text>

    <rect x="855" y="340" width="155" height="190" rx="18" fill="#153646" stroke="#34d399" stroke-width="2"/>
    <text x="877" y="380" class="box-title">PostgreSQL</text>
    <text x="877" y="410" class="body">canonical SoT</text>
    <text x="877" y="440" class="small">job · question</text>
    <text x="877" y="463" class="small">document · chunk</text>
    <text x="877" y="486" class="small">Evidence · lineage</text>

    <rect x="1030" y="340" width="155" height="190" rx="18" fill="#153646" stroke="#34d399" stroke-width="2"/>
    <text x="1052" y="380" class="box-title">Qdrant</text>
    <text x="1052" y="410" class="body">vector projection</text>
    <text x="1052" y="440" class="small">company filter</text>
    <text x="1052" y="463" class="small">source hash</text>
    <text x="1052" y="486" class="small">canonical readback gate</text>

    <rect x="1250" y="185" width="290" height="250" rx="18" fill="#382a42" stroke="#fb7185" stroke-width="2"/>
    <text x="1272" y="225" class="box-title">Capability cards</text>
    <circle cx="1280" cy="264" r="6" fill="#fb7185"/>
    <text x="1296" y="270" class="body">Report RAG</text>
    <circle cx="1280" cy="304" r="6" fill="#fbbf24"/>
    <text x="1296" y="310" class="body">Financial &amp; Regulatory</text>
    <circle cx="1280" cy="344" r="6" fill="#34d399"/>
    <text x="1296" y="350" class="body">Market &amp; Portfolio</text>
    <text x="1272" y="389" class="small">readiness · as-of · citation · limitation</text>

    <rect x="1250" y="465" width="290" height="135" rx="18" fill="#382a42" stroke="#fb7185" stroke-width="2"/>
    <text x="1272" y="505" class="box-title">Integrated observation</text>
    <text x="1272" y="535" class="body">citation-bound claims only</text>
    <text x="1272" y="563" class="small">analysis_ready / ready_partial</text>
  </g>

  <path d="M380 263 H455" class="arrow"/>
  <path d="M380 467 H415 V240 H455" class="arrow"/>
  <path d="M415 375 H455" class="arrow"/>
  <path d="M415 510 H455" class="arrow"/>
  <path d="M785 240 H855" class="arrow"/>
  <path d="M785 375 H820 V250 H855" class="arrow"/>
  <path d="M785 510 H820 V250 H855" class="arrow"/>
  <path d="M1020 315 V340" class="arrow"/>
  <path d="M1010 435 H1030" class="arrow"/>
  <path d="M1185 435 H1217 V310 H1250" class="arrow"/>
  <path d="M1395 435 V465" class="arrow"/>

  <rect x="60" y="650" width="1480" height="115" rx="20" fill="#0d1d31" stroke="#475569" stroke-width="2"/>
  <text x="84" y="690" class="box-title">Fail-closed safety gates</text>
  <text x="84" y="725" class="body">wrong company 0 · unsupported claim 0 · cross-company substitution 0 · Evidence ready before dual readback 0</text>
  <text x="84" y="750" class="small">한 축이 unavailable이어도 준비된 축은 ready_partial · provider failure를 fixture로 대체하지 않음</text>

  <path d="M800 600 V650" class="dash"/>
  <rect x="60" y="805" width="720" height="55" rx="14" fill="#12314b" stroke="#38bdf8"/>
  <text x="84" y="839" class="body">Full system: private artifacts · PostgreSQL · Qdrant · bounded providers</text>
  <rect x="820" y="805" width="720" height="55" rx="14" fill="#2e2740" stroke="#a78bfa"/>
  <text x="844" y="839" class="body">Public repo: executable contracts + sanitized replay · provider/DB/vector write 0</text>
</svg>
